<mat-card class="action-card" [class.disabled]="isDisabled()">
  <mat-card-header>
    <mat-card-title>
        <span class="icon">{{ icon() }}</span>
        {{ title() }}
    </mat-card-title>
  </mat-card-header>
  <mat-card-content>
    <p>{{ description() }}</p>
  </mat-card-content>
  <mat-card-actions>
    <mat-chip [disabled]="isDisabled()">{{ chipText() }}</mat-chip>
  </mat-card-actions>
</mat-card>
